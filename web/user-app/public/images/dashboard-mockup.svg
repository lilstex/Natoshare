<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" role="img" aria-label="Natoshare dashboard showing net position, category cards and recent activity">
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A4BE6" />
      <stop offset=".52" stop-color="#5B3AD1" />
      <stop offset="1" stop-color="#4668DB" />
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="1040" height="700" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="1040" height="700" fill="#F5F4FB" />

    <!-- browser chrome -->
    <rect x="0" y="0" width="1040" height="44" fill="#FFFFFF" />
    <circle cx="28" cy="22" r="6" fill="#E64980" />
    <circle cx="50" cy="22" r="6" fill="#EE8C22" />
    <circle cx="72" cy="22" r="6" fill="#12B886" />
    <rect x="140" y="11" width="320" height="22" rx="11" fill="#F5F4FB" stroke="#E5E2F1" />
    <text x="160" y="26" font-family="Arial, sans-serif" font-size="11" fill="#9A96AD">app.natoshare.dev/dashboard</text>

    <!-- hero net position card -->
    <rect x="32" y="76" width="620" height="172" rx="28" fill="url(#heroGradient)" />
    <circle cx="580" cy="112" r="70" fill="rgba(255,255,255,0.06)" />
    <circle cx="628" cy="204" r="42" fill="rgba(255,255,255,0.06)" />
    <text x="64" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.75)">NET POSITION</text>
    <text x="64" y="164" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">&#8358;2,142,300</text>
    <text x="64" y="200" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Savings &#8358;1.62M</text>
    <text x="220" y="200" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Deployed &#8358;480k</text>
    <text x="370" y="200" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Flexible Pool &#8358;42k</text>
    <text x="64" y="222" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Available to spend today: &#8358;6,200</text>

    <!-- flexible pool mini card -->
    <rect x="668" y="76" width="340" height="172" rx="24" fill="#FFFFFF" stroke="#E5E2F1" />
    <text x="696" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9A96AD">FLEXIBLE POOL</text>
    <text x="696" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1B1930">&#8358;42,000</text>
    <text x="696" y="172" font-family="Arial, sans-serif" font-size="12" fill="#6A6782">Not tied to a category yet</text>
    <rect x="696" y="190" width="140" height="32" rx="16" fill="#ECE7FC" />
    <text x="716" y="211" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#6D4AE0">+ Log income</text>

    <!-- category card: Rent -->
    <rect x="32" y="272" width="312" height="180" rx="22" fill="#FFFFFF" stroke="#E5E2F1" />
    <rect x="52" y="292" width="36" height="36" rx="12" fill="#ECE7FC" />
    <circle cx="70" cy="310" r="7" fill="#6D4AE0" />
    <text x="100" y="315" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#1B1930">Rent</text>
    <text x="292" y="312" font-family="Arial, sans-serif" font-size="16" fill="#9A96AD">&#8942;</text>
    <text x="52" y="358" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1930">Available &#8358;75,000</text>
    <rect x="52" y="382" width="272" height="8" rx="4" fill="#EFEDF9" />
    <rect x="52" y="382" width="217" height="8" rx="4" fill="#6D4AE0" />
    <rect x="171" y="378" width="2" height="16" fill="#1B1930" opacity="0.35" />
    <text x="52" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">ALLOCATED</text>
    <text x="52" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;375,000</text>
    <text x="145" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SPENT</text>
    <text x="145" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;300,000</text>
    <text x="238" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SAVED</text>
    <text x="238" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#12B886">&#8358;0</text>

