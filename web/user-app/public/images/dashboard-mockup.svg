    <rect x="384" y="292" width="36" height="36" rx="12" fill="#FBEDDC" />
    <circle cx="402" cy="310" r="7" fill="#EE8C22" />
    <text x="432" y="315" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#1B1930">Feeding</text>
    <rect x="592" y="298" width="72" height="22" rx="11" fill="#FBEDDC" />
    <text x="602" y="313" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#EE8C22">WATCH PACE</text>
    <text x="384" y="358" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1930">Available &#8358;0</text>
    <rect x="384" y="382" width="272" height="8" rx="4" fill="#EFEDF9" />
    <rect x="384" y="382" width="272" height="8" rx="4" fill="#EE8C22" />
    <rect x="558" y="378" width="2" height="16" fill="#1B1930" opacity="0.35" />
    <text x="384" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">ALLOCATED</text>
    <text x="384" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;375,000</text>
    <text x="477" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SPENT</text>
    <text x="477" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;410,000</text>
    <text x="570" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SAVED</text>
    <text x="570" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#12B886">&#8358;0</text>

    <!-- category card: Transportation -->
    <rect x="696" y="272" width="312" height="180" rx="22" fill="#FFFFFF" stroke="#E5E2F1" />
    <rect x="716" y="292" width="36" height="36" rx="12" fill="#E5EBFC" />
