# This workflow runs on every push and pull request. It checks that the backend
# builds and its tests pass, that the API can be built into a Docker image, that
# both frontend apps lint and build without errors, and that the whole stack
# actually works together (the "e2e" job, added in Phase 11).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Natoshare.slnx

      - name: Build
        run: dotnet build Natoshare.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Natoshare.slnx --no-build --configuration Release

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/Natoshare.Api/Dockerfile -t natoshare-api:ci .

  frontend:
    # user-app and admin-app are npm workspaces sharing one lockfile at the repo
    # root, so we install once and then lint/build each app by name.
    name: Frontend lint and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [user-app, admin-app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=${{ matrix.app }}

      - name: Build
        run: npm run build --workspace=${{ matrix.app }}

  e2e:
    # The whole stack, actually talking to each other: real Postgres, the real API
    # container, both real frontends built for production, one Playwright suite
    # covering the main user flow and an admin smoke test. See tests/e2e/README.md.
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [docker, frontend]
    env:
      ASPNETCORE_ENVIRONMENT: Development
    # docker-compose.yml expects an external Postgres (see its own top comment),
    # this is exactly that for CI: a plain GitHub Actions service container,
    # published to the runner's own localhost, which is what the api service (using
    # host networking, see docker-compose.yml) then reaches, the same way it would
    # reach a real external Postgres on a developer's own machine.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: natoshare
          POSTGRES_USER: natoshare
          POSTGRES_PASSWORD: natoshare_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U natoshare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start the API
        env:
          DB_USER: natoshare
          DB_PASSWORD: natoshare_ci_password
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5001/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose logs api
          exit 1

      - name: Build and start both frontends
        run: |
          echo "NEXT_PUBLIC_API_URL=http://localhost:5001/api/v1" > web/user-app/.env.local
          echo "NEXT_PUBLIC_API_URL=http://localhost:5001/api/v1" > web/admin-app/.env.local
          npm run build --workspace=user-app
          npm run build --workspace=admin-app
          npx --workspace=user-app next start -p 3000 &
          npx --workspace=admin-app next start -p 3001 &

      - name: Wait for both frontends
        run: |
          for url in http://localhost:3000 http://localhost:3001/login; do
            for i in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then
                echo "$url is up"
                break
              fi
              sleep 2
            done
          done

      - name: Install Playwright's browser
        run: npx --workspace=e2e playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: npm run e2e

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down
