    <text x="716" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;225,000</text>
    <text x="809" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SPENT</text>
    <text x="809" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1930">&#8358;140,000</text>
    <text x="902" y="426" font-family="Arial, sans-serif" font-size="10" fill="#9A96AD">SAVED</text>
    <text x="902" y="442" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#12B886">&#8358;0</text>

    <!-- recent activity -->
    <rect x="32" y="480" width="976" height="188" rx="22" fill="#FFFFFF" stroke="#E5E2F1" />
    <text x="60" y="516" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1930">Recent activity</text>

    <circle cx="64" cy="552" r="6" fill="#EE8C22" />
    <text x="84" y="557" font-family="Arial, sans-serif" font-size="13" fill="#1B1930">Expense &#8212; Feeding: Shoprite groceries</text>
    <text x="900" y="557" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#E64980">-&#8358;18,400</text>
    <text x="988" y="557" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#9A96AD">Today</text>
    <line x1="60" y1="572" x2="980" y2="572" stroke="#EFEDF9" />

    <circle cx="64" cy="596" r="6" fill="#6D4AE0" />
    <text x="84" y="601" font-family="Arial, sans-serif" font-size="13" fill="#1B1930">Expense &#8212; Rent: October rent</text>
    <text x="900" y="601" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#E64980">-&#8358;300,000</text>
    <text x="988" y="601" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#9A96AD">3 days ago</text>
    <line x1="60" y1="616" x2="980" y2="616" stroke="#EFEDF9" />

    <circle cx="64" cy="640" r="6" fill="#12B886" />
    <text x="84" y="645" font-family="Arial, sans-serif" font-size="13" fill="#1B1930">Income logged &#8212; Salary</text>
    <text x="900" y="645" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#12B886">+&#8358;750,000</text>
    <text x="988" y="645" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#9A96AD">1 week ago</text>
