    <text x="716" y="358" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1B1930">Available &#8358;85,000</text>
    <rect x="716" y="382" width="272" height="8" rx="4" fill="#EFEDF9" />
    <rect x="716" y="382" width="170" height="8" rx="4" fill="#4C6FE8" />
    <rect x="855" y="378" width="2" height="16" fill="#1B1930" opacity="0.35" />
