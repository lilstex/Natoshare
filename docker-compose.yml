# This file lets you run the API with one command: `docker compose up`.
# It is meant for local development, not for production.
#
# Postgres is external: something you already have running (your own machine, a
# managed cloud instance, whatever), not something this file starts for you. Copy
# .env.example to .env and fill in your own DB_* values, see that file's own
# comments. The api service uses host networking (Linux only), so it reaches
# "localhost" exactly the way any other process on your machine would, no
# Postgres reconfiguration needed even when Postgres itself only listens on
# localhost (the common default).
#
# Would rather run the API directly instead, no Docker at all? `dotnet run
# --project src/Natoshare.Api` reads the same root .env file too, see Program.cs's
# own comment on InsertRootDotEnvFallback.

services:
  api:
    build:
      context: .
      dockerfile: src/Natoshare.Api/Dockerfile
    container_name: natoshare-api
    restart: unless-stopped
    # Shares this machine's network stack directly (Linux only), instead of
    # getting its own isolated one. This is what lets "localhost" inside the
    # container mean the same thing it does everywhere else on your machine,
    # without needing Postgres to listen on anything but localhost, or any
    # docker-bridge-specific networking tricks. `ports:` below is meaningless
    # with host networking (the container already binds directly to the host's
    # ports), kept only so the mapping is still documented at a glance.
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__App: "Host=${DB_HOST:-localhost};Port=${DB_PORT:-5432};Database=${DB_NAME:-natoshare};Username=${DB_USER:-natoshare};Password=${DB_PASSWORD:-natoshare_dev_password}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-integration-test-signing-key-that-is-long-enough}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@natoshare.dev}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-NatoshareAdmin1}
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Cors__AllowedOrigins__1: "http://localhost:3001"
    ports:
      - "5001:5001"
